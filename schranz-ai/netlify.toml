# Third site from the same repository: base directory schranz-ai, one build command, no dependencies.
# Netlify: Add new project, Import from Git, this repository, Base directory schranz-ai.
# Publish directory and build command come from here.
[build]
  command = "node build.mjs"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  # SITE_URL is read by build.mjs for canonical and hreflang links. Netlify sets URL to the live address.
  SITE_URL = "${URL}"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.pptx"
  [headers.values]
    Content-Disposition = "attachment"
