<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anker</title>
<meta name="description" content="Persoenliches Begleitbuch bei SLE und Zoeliakie. Alle Eintraege bleiben auf diesem Geraet.">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">

<!--
  Alles kommt von dieser Adresse. Keine Schrift, kein Skript, kein Bild von
  irgendwo sonst: die App traegt Gesundheitsdaten, und die einzige Zusage, die
  wirklich haelt, ist die, dass gar keine Verbindung nach draussen aufgebaut wird.
  connect-src 'none' heisst: diese Seite kann nichts senden, auch nicht aus
  Versehen und auch nicht, wenn jemand spaeter Code einfuegt.

  frame-ancestors steht hier nicht, weil der Browser die Regel in einem
  meta-Element ignoriert. Den Rahmenschutz macht app.js von Hand.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

<!--
  Die Schrift liegt hier im Ordner, sie wird nicht von Google geladen. Der Grund
  ist derselbe wie ueberall in dieser App: es soll keine Anfrage nach draussen
  gehen, auch keine, die nur eine Schriftdatei holt und dabei die IP-Adresse
  mitnimmt. Geholt und abgelegt hat sie tools/selfhost-fonts.py.

  Die Zeile steht bewusst unter der Sicherheitsregel und nicht ueber ihr: eine
  CSP im Dokument gilt erst ab der Stelle, an der sie steht.
-->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">

<!--
  Der Zugang. Die beiden Dateien entstehen erst beim Veroeffentlichen, aus
  gate/gate.snippet.html ueber gate/split.py, und sind auf dieser Seite deshalb
  im Repository nicht vorhanden: lokal fehlen sie, der Browser uebergeht die
  beiden 404, und die App liegt offen, wie es sich zum Arbeiten gehoert.

  Warum zwei Dateien und kein eingesetzter Block wie auf den anderen Seiten:
  diese Seite erklaert oben script-src 'self' und style-src 'self'. Ein Block im
  Dokument waere stumm blockiert und die Seite stuende mit gruenem Lauf offen.
-->
<link rel="stylesheet" href="zugang.css">
<script src="zugang.js"></script>
</head>

<noscript>
  <!-- Klasse statt style-Attribut: die Regel oben verbietet Inline-Stil, und
       genau hier faellt das sonst niemandem auf. Der Block wird nur sichtbar,
       wenn JavaScript aus ist, und dann waere der Text ohne Rand am Rand
       gestanden. -->
  <p class="ohne-js" lang="en">
    Anker is a diary that runs entirely in the browser and sends nothing to a
    server. Without JavaScript there is nothing of it to see. Please allow
    JavaScript for this page.
  </p>
  <p class="ohne-js" lang="de">
    Anker ist ein Tagebuch, das vollstaendig im Browser laeuft und nichts an einen
    Server schickt. Ohne JavaScript gibt es davon nichts zu sehen. Bitte JavaScript
    fuer diese Seite erlauben.
  </p>
</noscript>

<!--
  Eine Datei je Sprache. Englisch fuehrt, inhalt-de.js traegt das Deutsche. Eine Sprache dazunehmen heisst: Datei schreiben, hier eine

-->
<script src="inhalt-de.js"></script>
<script src="inhalt-en.js"></script>
