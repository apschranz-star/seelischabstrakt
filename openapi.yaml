openapi: 3.1.0
info:
  title: Schranz sites API
  version: "2.0"
  description: Maintain both sites from one place. /works and /site drive the shop seelischabstrakt.netlify.app, /journal drives the personal page alexanderschranz.netlify.app. Every change is committed to the same GitHub repository and is live within about a minute.
servers:
  - url: https://seelischabstrakt.netlify.app/api
paths:
  /works:
    get:
      operationId: listWorks
      summary: List all works with id, title, size, price, availability
      responses:
        "200":
          description: Works
    post:
      operationId: upsertWork
      summary: Add a new work, update an existing one (send its id), or delete (action delete)
      description: >-
        Adding a work needs title, w, h and price. Without them the call is rejected with 400 and nothing is
        written; never guess a missing value, ask for it. Numbers must be sent as plain numbers, so 4800 and
        not "4.800" or "4800". A title whose id already exists is refused with 409, so to change a work send
        its id from listWorks instead of the title. Fields you leave out keep their current value.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [add, update, delete]
                  description: add (default when no id), update (needs id), delete (needs id)
                id:
                  type: string
                  description: Existing work id, from listWorks
                title:
                  type: string
                year:
                  type: integer
                w:
                  type: number
                  description: Width in cm
                h:
                  type: number
                  description: Height in cm
                medium:
                  type: object
                  properties:
                    en: { type: string }
                    de: { type: string }
                caption:
                  type: object
                  description: One or two sentences shown under the work, in English and German
                  properties:
                    en: { type: string }
                    de: { type: string }
                price:
                  type: number
                  description: Price of the original in EUR
                available:
                  type: boolean
                  description: false marks the original as sold
                link:
                  type: string
                  description: Optional Stripe or PayPal payment link for the original
                prints:
                  type: array
                  items:
                    type: object
                    properties:
                      size: { type: string, description: "e.g. 30 × 40" }
                      price: { type: number }
                      link: { type: string }
                size:
                  type: string
                  enum: ["", wide, small]
                  description: Grid size on the page
                nomat:
                  type: boolean
                  description: true shows the photo without black frame and mat
                imageUrl:
                  type: string
                  description: Public URL of a photo to download and attach (jpg, png, webp, under 6 MB)
      responses:
        "200":
          description: Result with the saved work
  /site:
    get:
      operationId: getSite
      summary: Read all site settings (texts EN/DE, design, shop rules, shipping rates, legal data) as JSON
      responses:
        "200":
          description: site.json without the publish block
    post:
      operationId: updateSite
      summary: Change site settings. Use patch to deep-merge an object, or sets to change single values by dotted path. Allowed top-level keys are brand, theme, commerce, texts, printTiers, legal.
      description: >-
        patch merges objects and replaces lists and single values outright, so a patch that carries one entry
        of a list replaces the whole list. A dotted path may not walk through a single value: brand.motto is
        one text for both languages, so write {"path":"brand.motto","value":"..."} and never brand.motto.de.
        A path that does not exist yet is created, so check the spelling against getSite first. Texts that are
        lists, such as texts.aboutParagraphs and texts.commission.steps, must stay lists per language.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [patch, set]
                  description: patch (default when patch is given) merges objects and replaces arrays and scalars; set writes single values by path
                patch:
                  type: object
                  description: "Partial site.json, e.g. {\"texts\":{\"heroMeta\":{\"de\":\"Neun Arbeiten\",\"en\":\"Nine works\"}},\"theme\":{\"layout\":{\"hideSections\":[\"commission\"]}}}"
                sets:
                  type: array
                  description: "List of single changes, e.g. [{\"path\":\"commerce.shipping.rates.AT.print\",\"value\":9},{\"path\":\"texts.ui.de.nav.works\",\"value\":\"Bilder\"}]"
                  items:
                    type: object
                    properties:
                      path: { type: string, description: "Dotted path starting with brand, theme, commerce, texts, printTiers or legal. Array items by index, e.g. printTiers.0.price" }
                      value: { description: "New value: string, number, boolean, object or array" }
                message:
                  type: string
                  description: Optional commit message shown in the repository history
      responses:
        "200":
          description: Result with changed top-level keys and the new site settings
        "400":
          description: Validation error, nothing was written
  /journal:
    get:
      operationId: getJournal
      summary: Read the whole personal journal (masthead, entries, plates, colophon) of alexanderschranz.netlify.app
      responses:
        "200":
          description: journal.json
    post:
      operationId: updateJournal
      summary: Change the personal journal. Actions - entry adds or updates one entry, deleteEntry removes one, plate and deletePlate do the same for the photographs page, patch merges an object, set writes single values by path, image uploads a photograph.
      description: >-
        Use action entry for anything about an entry; it merges by id and keeps every field you leave out.
        A language you do not send is kept, so sending only de changes only the German. Do not use patch for
        entries or plates: patch replaces the whole list, which deletes every entry you did not include.
        Dash characters are rejected in every text, use a comma or a full stop. At most six published entries
        are allowed; write a seventh with draft true. A photograph must be uploaded with action image first,
        the call returns the path to put into figure.src or into a plate. Uploading with a name that already
        exists replaces that photograph everywhere it is used.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [entry, deleteEntry, plate, deletePlate, patch, set, image]
                entry:
                  type: object
                  description: One journal entry. Matched by id, so sending an existing id updates that entry and leaves the fields you omit untouched.
                  properties:
                    id: { type: string, description: "Short slug. Left out on a new entry it is derived from the English title." }
                    kicker: { type: object, description: "Two or three words above the headline", properties: { en: { type: string }, de: { type: string } } }
                    title: { type: object, properties: { en: { type: string }, de: { type: string } } }
                    standfirst: { type: object, description: "One sentence under the headline. It must say something the first paragraph does not.", properties: { en: { type: string }, de: { type: string } } }
                    paragraphs: { type: object, description: "Three to five short paragraphs per language", properties: { en: { type: array, items: { type: string } }, de: { type: array, items: { type: string } } } }
                    pullquote: { type: object, description: "One sentence taken from the entry itself", properties: { en: { type: string }, de: { type: string } } }
                    draft: { type: boolean, description: "true writes the entry but keeps it off the page" }
                    figure:
                      type: object
                      properties:
                        src: { type: string, description: "Must start with img/ . Upload the photograph first with action image." }
                        layout: { type: string, enum: [block, plate], description: "block sits beside the text, plate runs across the full width" }
                        caption: { type: object, properties: { en: { type: string }, de: { type: string } } }
                        size: { type: string, description: "Pixel size of the file, for example 1400x1000" }
                    factbox:
                      type: object
                      description: The one boxed list on the page. Send null to remove it.
                      properties:
                        title: { type: object, properties: { en: { type: string }, de: { type: string } } }
                        items: { type: object, properties: { en: { type: array, items: { type: string } }, de: { type: array, items: { type: string } } } }
                position:
                  type: integer
                  description: Where to insert a new entry or plate. Left out it goes last.
                id:
                  type: string
                  description: For deleteEntry
                plate:
                  type: object
                  description: One photograph on the plates page, matched by src
                  properties:
                    src: { type: string }
                    caption: { type: object, properties: { en: { type: string }, de: { type: string } } }
                    size: { type: string }
                src:
                  type: string
                  description: For deletePlate
                patch:
                  type: object
                  description: "Partial journal.json. Allowed at top level - masthead, entries, plates, colophon, seo"
                sets:
                  type: array
                  description: "Single values by dotted path, for example [{\"path\": \"masthead.motto.de\", \"value\": \"...\"}]"
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      value: {}
                name:
                  type: string
                  description: For image. The file name without extension, it is turned into a slug.
                imageBase64:
                  type: string
                  description: For image. A JPEG as base64.
                imageUrl:
                  type: string
                  description: For image. A public https URL of a jpg, png or webp under 6 MB.
                message:
                  type: string
                  description: Optional commit message
      responses:
        "200":
          description: Result with the new journal
        "400":
          description: Validation failed, nothing was written
components:
  securitySchemes:
    deskKey:
      type: apiKey
      in: header
      name: x-desk-key
