openapi: 3.1.0
info:
  title: Schranz sites API
  version: "2.0"
  description: Maintain both sites from one place. /works and /site drive the shop seelischabstrakt.netlify.app, /journal drives the personal page alexanderschranz.netlify.app. Every change is committed to the same GitHub repository and is live within about a minute.
servers:
  - url: https://seelischabstrakt.netlify.app/api
paths:
  /works:
    get:
      operationId: listWorks
      summary: List all works with id, title, size, price, availability
      responses:
        "200":
          description: Works
    post:
      operationId: upsertWork
      summary: Add a new work, update an existing one (send its id), or delete (action delete)
      description: >-
        Adding a work needs title, w, h and price. Without them the call is rejected with 400 and nothing is
        written; never guess a missing value, ask for it. Numbers must be sent as plain numbers, so 4800 and
        not "4.800" or "4800". A title whose id already exists is refused with 409, so to change a work send
        its id from listWorks instead of the title. Fields you leave out keep their current value.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [add, update, delete]
                  description: add (default when no id), update (needs id), delete (needs id)
                id:
                  type: string
                  description: Existing work id, from listWorks
                title:
                  type: string
                year:
                  type: integer
                w:
                  type: number
                  description: Width in cm
                h:
                  type: number
                  description: Height in cm
                medium:
                  type: object
                  properties:
                    en: { type: string }
                    de: { type: string }
                caption:
                  type: object
                  description: One or two sentences shown under the work, in English and German
                  properties:
                    en: { type: string }
                    de: { type: string }
                price:
                  type: number
                  description: Price of the original in EUR
                available:
                  type: boolean
                  description: false marks the original as sold
                link:
                  type: string
                  description: Optional Stripe or PayPal payment link for the original
                prints:
                  type: array
                  items:
                    type: object
                    properties:
                      size: { type: string, description: "e.g. 30 × 40" }
                      price: { type: number }
                      link: { type: string }
                size:
                  type: string
                  enum: ["", wide, small]
                  description: Grid size on the page
                nomat:
                  type: boolean
                  description: true shows the photo without black frame and mat
                imageUrl:
                  type: string
                  description: Public URL of a photo to download and attach (jpg, png, webp, under 6 MB)
      responses:
        "200":
          description: Result with the saved work
  /site:
    get:
      operationId: getSite
      summary: Read all site settings (texts EN/DE, design, shop rules, shipping rates, legal data) as JSON
      responses:
        "200":
          description: site.json without the publish block
    post:
      operationId: updateSite
      summary: Change site settings. Use patch to deep-merge an object, or sets to change single values by dotted path. Allowed top-level keys are brand, theme, commerce, texts, printTiers, legal.
      description: >-
        patch merges objects and replaces lists and single values outright, so a patch that carries one entry
        of a list replaces the whole list. A dotted path may not walk through a single value: brand.motto is
        one text for both languages, so write {"path":"brand.motto","value":"..."} and never brand.motto.de.
        A path that does not exist yet is created, so check the spelling against getSite first. Texts that are
        lists, such as texts.aboutParagraphs and texts.commission.steps, must stay lists per language.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [patch, set]
                  description: patch (default when patch is given) merges objects and replaces arrays and scalars; set writes single values by path
                patch:
                  type: object
                  description: "Partial site.json, e.g. {\"texts\":{\"heroMeta\":{\"de\":\"Neun Arbeiten\",\"en\":\"Nine works\"}},\"theme\":{\"layout\":{\"hideSections\":[\"commission\"]}}}"
                sets:
                  type: array
                  description: "List of single changes, e.g. [{\"path\":\"commerce.shipping.rates.AT.print\",\"value\":9},{\"path\":\"texts.ui.de.nav.works\",\"value\":\"Bilder\"}]"
                  items:
                    type: object
                    properties:
                      path: { type: string, description: "Dotted path starting with brand, theme, commerce, texts, printTiers or legal. Array items by index, e.g. printTiers.0.price" }
                      value: { description: "New value: string, number, boolean, object or array" }
                message:
                  type: string
                  description: Optional commit message shown in the repository history
      responses:
        "200":
          description: Result with changed top-level keys and the new site settings
        "400":
          description: Validation error, nothing was written
  /journal:
    get:
      operationId: getJournal
      summary: Read the whole personal page (profile, story chapters, written texts, reader comments) of alexanderschranz.netlify.app
      responses:
        "200":
          description: journal.json
    post:
      operationId: updateJournal
      summary: Change the personal page. Actions - chapter and deleteChapter for the story, post and deletePost for the written texts, comment, hideComment and deleteComment for reader thoughts, patch merges an object, set writes single values by path, image uploads a photograph.
      description: >-
        The personal page has three parts. story.chapters is Alexander's life told in at most six published
        chapters. writing.posts are the texts people can read and comment under. comments are the reader
        thoughts he has approved; everything in that list is visible on the page.
        Use action chapter and action post for anything about those; both merge by id and keep every field
        you leave out. A language you do not send is kept, so sending only de changes only the German.
        Do not use patch for chapters, posts or comments - patch replaces the whole list, which deletes
        everything you did not include. Anything with draft true is written but stays off the page, which is
        the safe way to work on a half finished text. A published chapter or text needs paragraphs in both
        languages. Dash characters are rejected in every text Alexander writes, use a comma or a full stop;
        a reader comment is left exactly as the reader wrote it. A photograph must be uploaded with action
        image first, the call returns the path to put into image.src. Uploading with a name that already
        exists replaces that photograph everywhere it is used.
        Comments - readers send their thought through the form on the page and it arrives by email, it does
        not appear here by itself. Nothing is public until Alexander says so. When he says publish it, send
        action comment with post, name and text, and it appears under that text. author "me" writes the same
        entry as a reply from Alexander. hideComment takes a published comment off the page but keeps it,
        deleteComment removes it for good. Never publish a comment he has not approved, and never invent one.
      security:
        - deskKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [chapter, deleteChapter, post, deletePost, comment, hideComment, deleteComment, patch, set, image]
                chapter:
                  type: object
                  description: One chapter of the story. Matched by id, so sending an existing id updates that chapter and leaves the fields you omit untouched.
                  properties:
                    id: { type: string, description: "Short slug. Left out on a new chapter it is derived from the English title." }
                    title: { type: object, properties: { en: { type: string }, de: { type: string } } }
                    period: { type: object, description: "Small line above the title, for example Childhood. Not a date if he does not want one.", properties: { en: { type: string }, de: { type: string } } }
                    paragraphs: { type: object, description: "Three or four short paragraphs per language, feelings and turning points rather than facts", properties: { en: { type: array, items: { type: string } }, de: { type: array, items: { type: string } } } }
                    draft: { type: boolean, description: "true writes the chapter but keeps it off the page" }
                    image:
                      type: object
                      description: One photograph beside the chapter. Send null to remove it.
                      properties:
                        src: { type: string, description: "Must start with img/ . Upload the photograph first with action image." }
                        caption: { type: object, description: "What the photograph actually shows. Never describe something that is not in it.", properties: { en: { type: string }, de: { type: string } } }
                        size: { type: string, description: "Pixel size of the file, for example 1400x1000" }
                post:
                  type: object
                  description: One written text. Matched by id, so sending an existing id updates that text and leaves the fields you omit untouched.
                  properties:
                    id: { type: string, description: "Short slug. Left out on a new text it is derived from the English title." }
                    date: { type: string, description: "2026-09-14. Left out on a new text it is today." }
                    title: { type: object, properties: { en: { type: string }, de: { type: string } } }
                    excerpt: { type: object, description: "One sentence in the list. Left out it follows the first paragraph.", properties: { en: { type: string }, de: { type: string } } }
                    paragraphs: { type: object, properties: { en: { type: array, items: { type: string } }, de: { type: array, items: { type: string } } } }
                    draft: { type: boolean, description: "true writes the text but keeps it off the page" }
                    commentsClosed: { type: boolean, description: "true hides the form under this text" }
                    images:
                      type: array
                      description: Photographs inside the text. Sending this replaces the whole list, send [] to remove them all.
                      items:
                        type: object
                        properties:
                          src: { type: string, description: "Must start with img/" }
                          caption: { type: object, properties: { en: { type: string }, de: { type: string } } }
                          size: { type: string }
                comment:
                  type: object
                  description: One approved reader thought, or a reply from Alexander. Only send this when he has said the comment may go on the page.
                  properties:
                    id: { type: string, description: "Only to change an existing comment. On a new one it is made from the text id and the name." }
                    post: { type: string, description: "The id of the text it belongs under, from writing.posts" }
                    name: { type: string, description: "As the reader signed, at most 60 characters" }
                    text: { type: string, description: "The comment word for word, at most 2000 characters. Do not tidy it up." }
                    date: { type: string, description: "2026-09-14. Left out it is today." }
                    author: { type: string, enum: [me], description: "me writes the entry as a reply from Alexander" }
                    approved: { type: boolean, description: "false hides it, same as hideComment" }
                position:
                  type: integer
                  description: Where to insert a new chapter or text. A chapter goes last, a text goes first.
                id:
                  type: string
                  description: For deleteChapter, deletePost, hideComment and deleteComment
                patch:
                  type: object
                  description: "Partial journal.json. Allowed at top level - profile, nav, story, writing, commentForm, comments, contact, footer, seo"
                sets:
                  type: array
                  description: "Single values by dotted path, for example [{\"path\": \"profile.tagline.de\", \"value\": \"...\"}]"
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      value: {}
                name:
                  type: string
                  description: For image. The file name without extension, it is turned into a slug.
                imageBase64:
                  type: string
                  description: For image. A JPEG as base64.
                imageUrl:
                  type: string
                  description: For image. A public https URL of a jpg, png or webp under 6 MB.
                message:
                  type: string
                  description: Optional commit message
      responses:
        "200":
          description: Result with the new journal
        "400":
          description: Validation failed, nothing was written
components:
  securitySchemes:
    deskKey:
      type: apiKey
      in: header
      name: x-desk-key
