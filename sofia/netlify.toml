# Sofia: its own Netlify project (sofia-piano), built from this folder.
# Connect it with base directory "sofia", or deploy from inside sofia/.
[build]
  publish = "app"
  functions = "netlify/functions"
  command = "sh tools/build.sh"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Static responses only; the two functions set their own headers in code.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
