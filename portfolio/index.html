<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexander Schranz</title>
<meta name="description" content="The journal of Alexander Schranz, painter in Vienna.">
<link rel="canonical" href="https://alexanderschranz.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="Alexander Schranz">
<meta property="og:image" content="img/alexander-schranz.jpg">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&display=swap">
<style>
:root{
  --paper:#F4F3F1; --paper-2:#EAE8E5; --ink:#141414; --ink-2:#3A3A38; --ink-3:#67645F;
  --rule:#C6C3BE; --rule-2:#8E8B86;
  --display:"Bodoni Moda",Didot,"Playfair Display",Georgia,serif;
  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --label:"Archivo","Helvetica Neue",Arial,sans-serif;
  --sheet:1280px; --gutter:26px; --head:34px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-ed="day"]){ --paper:#111110; --paper-2:#1B1B19; --ink:#EDEBE6; --ink-2:#C7C4BD; --ink-3:#918D86; --rule:#3A3936; --rule-2:#5C5A55; }
}
:root[data-ed="night"]{ --paper:#111110; --paper-2:#1B1B19; --ink:#EDEBE6; --ink-2:#C7C4BD; --ink-3:#918D86; --rule:#3A3936; --rule-2:#5C5A55; }
*{box-sizing:border-box}
html{background:var(--paper)}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text);-webkit-font-smoothing:antialiased;
  padding-inline:clamp(16px,4.4vw,56px);padding-block:0 0}
.sheet{max-width:var(--sheet);margin:0 auto}
img{display:block;max-width:100%;height:auto;filter:grayscale(1) contrast(1.04);background:var(--paper-2)}
@supports (filter: url("#press")){ img{filter:url(#press)} }
a{color:inherit}

/* masthead */
.ears{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  padding-block:14px 10px}
.switches{display:flex;gap:6px}
.switches button{font:inherit;letter-spacing:.14em;background:none;color:var(--ink-3);border:1px solid var(--rule);padding:4px 8px;cursor:pointer}
.switches button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.masthead{border-top:1px solid var(--ink);padding-block:18px 10px;text-align:center}
.masthead h1{margin:0;font-family:var(--display);font-weight:900;font-variation-settings:"opsz" 96;
  font-size:clamp(2.9rem,11.4vw,4.6rem);line-height:.86;letter-spacing:-.015em;text-transform:uppercase;word-spacing:.1em}
.masthead h1 span{display:block}
@media (min-width:760px){ .masthead h1{font-size:clamp(3.2rem,7.1vw,6.6rem);line-height:.94} .masthead h1 span{display:inline} }
.strap{border-bottom:4px double var(--ink);padding-block:12px 14px;text-align:center}
.strap .m{font-family:var(--text);font-style:italic;font-size:clamp(1rem,2.1vw,1.35rem);margin:0}
.strap .s{font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 0}

/* contents */
.contents{padding-block:16px 0;border-bottom:1px solid var(--ink)}
.contents h2{margin:0 0 10px;font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.contents ol{list-style:none;margin:0;padding:0 0 12px;display:grid;gap:0}
@media (min-width:760px){ .contents ol{grid-template-columns:1fr 1fr;column-gap:var(--gutter)} }
.contents li{border-top:1px solid var(--rule)}
.contents a{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:9px 0;text-decoration:none}
.contents .no{font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink-3);min-width:2.2em}
.contents .t{flex:1 1 auto;font-family:var(--text);font-size:16px}
.contents .k{font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* entries */
article{padding-block:0 0}
.folio-top{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;justify-content:space-between;
  height:var(--head);background:var(--paper);border-bottom:1px solid var(--rule);
  font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.folio-top .mid{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry{padding-block:26px 0}
@media (min-width:1000px){
  .entry{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gutter);align-items:start}
  .entry .head{grid-column:1 / 13}
  .entry .text{grid-column:1 / 8}
  .entry figure.block{grid-column:9 / 13}
  .entry:nth-of-type(even) .text{grid-column:6 / 13}
  .entry:nth-of-type(even) figure.block{grid-column:1 / 5;grid-row:2}
  .entry figure.plate,.entry .quote,.entry .factbox.wide,.entry .folio-foot{grid-column:1 / 13}
}
.kicker{font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.entry h2{margin:0;font-family:var(--display);font-weight:700;font-variation-settings:"opsz" 96;
  font-size:clamp(2rem,5.4vw,4.1rem);line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.standfirst{margin:12px 0 0;font-family:var(--text);font-weight:300;font-size:clamp(1.05rem,1.9vw,1.4rem);line-height:1.35;color:var(--ink-2);max-width:46ch}
.head{padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.text p{margin:0;text-wrap:pretty}
.text p + p{text-indent:1.1em;margin-top:0}
@media (min-width:1000px){
  .text{column-count:2;column-gap:var(--gutter);column-rule:1px solid var(--rule)}
  .entry .text{text-align:justify;hyphens:auto}
}
.text .cap::first-letter{float:left;font-family:var(--display);font-weight:900;font-size:3.6em;line-height:.72;margin:.04em .09em -.06em 0}
figure{margin:0 0 22px}
figure img{border:1px solid var(--rule-2)}
.entry figure.block img{max-height:62vh;width:auto;margin-inline:auto}
figcaption{font-family:var(--label);font-size:10.5px;font-weight:500;line-height:1.45;letter-spacing:.04em;color:var(--ink-3);
  padding-top:8px;border-bottom:1px solid var(--rule);padding-bottom:8px}
figure.plate{margin-block:26px}
figure.plate img{max-height:74vh;width:auto;margin-inline:auto}
@media (max-width:999px){ figure.plate img{max-height:62vh} }
.quote{margin:26px 0 22px;padding-block:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);
  font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,3.1vw,2.1rem);line-height:1.18;letter-spacing:-.01em;text-align:center;text-wrap:balance}
.factbox{border:1px solid var(--rule-2);padding:16px;margin-block:8px 22px;background:none}
:root[data-ed="night"] .factbox,
:root:not([data-ed="day"]) .factbox{background:var(--paper-2)}
@media (prefers-color-scheme: light){ :root:not([data-ed="night"]) .factbox{background:none} }
.factbox h3{margin:0 0 10px;font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.factbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px;line-height:1.4}
.factbox li{padding-left:14px;position:relative}
.factbox li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:1px;background:var(--ink-3)}
.folio-foot{display:flex;gap:12px;justify-content:space-between;align-items:center;white-space:nowrap;border-top:1px solid var(--rule);
  padding-block:9px 0;margin-top:20px;font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.endmark{width:9px;height:9px;background:var(--ink);display:inline-block}

/* jump line and colophon */
.jump{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:34px}
.jump a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;text-decoration:none}
.jump .l{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3.6vw,2.4rem);letter-spacing:-.01em}
.jump .r{font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
footer{border-top:1px solid var(--rule);margin-top:30px;padding-block:16px 46px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;
  font-family:var(--label);font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--ink-3)}
footer p{margin:0;max-width:56ch}
footer a{color:var(--ink-2)}

/* plates page */
.plates{padding-block:26px 0}
.plates .lead{font-family:var(--text);font-weight:300;font-size:clamp(1.05rem,2vw,1.4rem);color:var(--ink-2);max-width:50ch;margin:0 0 26px}
.plate-item{margin:0 0 34px;content-visibility:auto;contain-intrinsic-size:0 620px}
.plate-item .no{font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.plate-item img{max-height:82vh;width:auto;margin-inline:auto}
@media (min-width:1000px){ .plate-item{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gutter)}
  .plate-item .no{grid-column:1 / 13}
  .plate-item img{grid-column:1 / 10}
  .plate-item figcaption{grid-column:10 / 13;border-bottom:0;padding-top:0}
}

.rv{opacity:0}
.rv.in{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .rv{opacity:1} .rv.in{animation:none} }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="press" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values=".38 .50 .12 0 0  .38 .50 .12 0 0  .38 .50 .12 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.05" exponent=".95"/>
      <feFuncG type="gamma" amplitude="1.05" exponent=".95"/>
      <feFuncB type="gamma" amplitude="1.05" exponent=".95"/>
    </feComponentTransfer>
  </filter>
</svg>

<div class="sheet">
  <div class="ears">
    <span id="ear-left"></span>
    <span class="switches" id="switches"></span>
  </div>
  <header class="masthead"><h1 id="wordmark"></h1></header>
  <div class="strap"><p class="m" id="motto"></p><p class="s" id="motto-sub"></p></div>
  <nav class="contents" id="contents" aria-label="Contents"></nav>
  <main id="main"></main>
  <footer id="colophon"></footer>
</div>

<script>
let D=null, lang="en";
const $=s=>document.querySelector(s);
const L=v=>v==null?"":(typeof v==="string"?v:(v[lang]||v.en||v.de||""));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dim=o=>{ const m=/^(\d+)x(\d+)$/.exec(String((o&&o.size)||"")); return m?` width="${m[1]}" height="${m[2]}"`:""; };
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X"];
const isPlates=()=>location.pathname.replace(/\/$/,"").endsWith("/photos")||/photos\.html$/.test(location.pathname);

function setTheme(v){ if(v==="auto") document.documentElement.removeAttribute("data-ed"); else document.documentElement.dataset.ed=v;
  try{ localStorage.setItem("as-ed",v); }catch(e){} paintSwitches(); }
function paintSwitches(){
  const cur=document.documentElement.dataset.ed||"auto";
  const wrap=$("#switches"); if(!wrap||!D) return;
  const langs=`<button type="button" data-lang="en" aria-pressed="${lang==="en"}">EN</button><button type="button" data-lang="de" aria-pressed="${lang==="de"}">DE</button>`;
  const eds=[["auto","Auto"],["day",lang==="de"?"Tag":"Day"],["night",lang==="de"?"Nacht":"Night"]]
    .map(([v,t])=>`<button type="button" data-ed="${v}" aria-pressed="${cur===v}">${t}</button>`).join("");
  wrap.innerHTML=langs+eds;
  wrap.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem("as-lang",lang);}catch(e){} render(); });
  wrap.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>setTheme(b.dataset.ed));
}

function entryHtml(e,i,total){
  const no=ROMAN[i+1]||String(i+1);
  const f=e.figure&&e.figure.src?e.figure:null;
  const fig=f?`<figure class="${f.layout==="plate"?"plate":"block"}"><img src="${esc(f.src)}" alt="${esc(L(e.title))}"${dim(f)} loading="${i===0?"eager":"lazy"}" decoding="async">${L(f.caption)?`<figcaption>${esc(L(f.caption))}</figcaption>`:""}</figure>`:"";
  const paras=(e.paragraphs&&(e.paragraphs[lang]||e.paragraphs.en)||[]).map((p,j)=>`<p${i===0&&j===0?' class="cap"':""}>${esc(p)}</p>`).join("");
  const fb=e.factbox?`<div class="factbox${f&&f.layout==="plate"?" wide":""}"><h3>${esc(L(e.factbox.title))}</h3><ul>${(e.factbox.items[lang]||e.factbox.items.en||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const q=L(e.pullquote)?`<blockquote class="quote">${esc(L(e.pullquote))}</blockquote>`:"";
  return `<article id="${esc(e.id)}" class="rv">
    <div class="folio-top"><span>${lang==="de"?"Nr.":"No."} ${no}</span><span class="mid">${esc(L(e.kicker))}</span><span>${no} / ${ROMAN[total]||total}</span></div>
    <div class="entry">
      <div class="head"><p class="kicker">${esc(L(e.kicker))}</p><h2>${esc(L(e.title))}</h2>${L(e.standfirst)?`<p class="standfirst">${esc(L(e.standfirst))}</p>`:""}</div>
      ${f&&f.layout==="plate"?fig:""}
      <div class="text">${paras}</div>
      ${f&&f.layout!=="plate"?fig+fb:fb}
      ${q}
      <div class="folio-foot"><span>${no} / ${ROMAN[total]||total}</span><span>${lang==="de"?"Wien 1180":"Vienna 1180"}</span><span class="endmark" aria-hidden="true"></span></div>
    </div>
  </article>`;
}

function render(){
  const m=D.masthead||{};
  document.documentElement.lang=lang;
  document.title=isPlates()?`${L((D.plates||{}).title)||"Plates"} · ${m.name||""}`:((D.seo&&D.seo.title)||m.name||"");
  const md=document.querySelector('meta[name="description"]'); if(md&&D.seo) md.content=L(D.seo.description);
  const parts=String(m.name||"").split(" ");
  $("#wordmark").innerHTML=parts.map(p=>`<span>${esc(p)}</span>`).join(" ");
  $("#ear-left").textContent=L(m.earLeft);
  $("#motto").textContent=L(m.motto);
  $("#motto-sub").textContent=L(m.mottoSub);
  const live=(D.entries||[]).filter(e=>!e.draft);
  const pl=D.plates||{};

  if(isPlates()){
    $("#contents").innerHTML="";
    $("#contents").hidden=true;
    const items=(pl.items||[]).filter(x=>x.src);
    $("#main").innerHTML=`<section class="plates">
      <div class="head" style="border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:24px">
        <p class="kicker">${esc(L(pl.label))}</p><h2 style="margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,7vw,5rem);line-height:.95;letter-spacing:-.02em">${esc(L(pl.title))}</h2>
      </div>
      <p class="lead">${esc(L(pl.intro))}</p>
      ${items.map((x,i)=>`<figure class="plate-item rv"><div class="no">${lang==="de"?"Tafel":"Plate"} ${ROMAN[i+1]||i+1}</div><img src="${esc(x.src)}" alt="${esc(L(x.caption))}"${dim(x)} loading="lazy" decoding="async"><figcaption>${esc(L(x.caption))}</figcaption></figure>`).join("")}
      <div class="jump"><a href="./"><span class="l">${esc(L(pl.backLabel))}</span><span class="r">${esc(m.name||"")}</span></a></div>
    </section>`;
  } else {
    $("#contents").hidden=false;
    $("#contents").innerHTML=`<h2>${esc(L(m.contentsLabel))}</h2><ol>${live.map((e,i)=>
      `<li><a href="#${esc(e.id)}"><span class="no">${ROMAN[i+1]||i+1}</span><span class="t">${esc(L(e.title))}</span><span class="k">${esc(L(e.kicker))}</span></a></li>`).join("")}</ol>`;
    $("#main").innerHTML=live.map((e,i)=>entryHtml(e,i,live.length)).join("")
      +(pl.items&&pl.items.length?`<div class="jump rv"><a href="photos.html"><span class="l">${esc(L(pl.jumpLabel))}</span><span class="r">${lang==="de"?"Seite":"Page"} →</span></a></div>`:"");
  }

  const c=D.colophon||{};
  $("#colophon").innerHTML=`<p>${esc(L(c.text))}</p>${c.email?`<p><a href="mailto:${esc(c.email)}">${esc(L(c.contactLabel)||"Write")}: ${esc(c.email)}</a></p>`:""}`;
  paintSwitches(); reveal();
}

let io=null;
function reveal(){
  if(!("IntersectionObserver" in window)){ document.querySelectorAll(".rv").forEach(e=>e.classList.add("in")); return; }
  io=io||new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),{threshold:.04,rootMargin:"0px 0px -4% 0px"});
  void document.body.offsetHeight;
  requestAnimationFrame(()=>document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el)));
}

try{ const t=localStorage.getItem("as-ed"); if(t&&t!=="auto") document.documentElement.dataset.ed=t; }catch(e){}
fetch("journal.json?v="+Date.now()).then(r=>r.json()).then(j=>{
  D=j;
  const q=new URLSearchParams(location.search).get("lang");
  let saved=null; try{ saved=localStorage.getItem("as-lang"); }catch(e){}
  const nav=(navigator.language||"").toLowerCase().startsWith("de")?"de":null;
  lang=q||saved||nav||(j.masthead&&j.masthead.defaultLang)||"en";
  render();
}).catch(err=>{ document.getElementById("main").innerHTML=`<p style="font-family:var(--label);font-size:13px;color:var(--ink-3);border:1px dashed var(--rule);padding:22px">journal.json could not be read. Check it for a missing comma at jsonlint.com. ${esc(err.message)}</p>`; });
</script>
</body>
</html>
