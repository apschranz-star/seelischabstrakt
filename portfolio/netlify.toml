# alexanderschranz.netlify.app: static journal, no build. Netlify: base directory "portfolio", publish directory "portfolio".
[build]
  publish = "."
  # Arms the access gate when SITE_ACCESS_KEY is set in the Netlify environment, see ../gate/README.md.
  command = "sh ../gate/inject.sh index.html \"$SITE_ACCESS_KEY\""
  # Build only when something in this folder changed. Compares against the last commit that was
  # actually deployed, not against the previous commit, so a skipped build never leaves the site
  # behind. If the comparison cannot run, the command fails and Netlify builds as usual.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

