<script>
/* Start fetching the content now, while the app code is still downloading.
   src/lib/shop.tsx picks the promise up; without it, it fetches by itself. */
(function () {
  try {
    var v = '?v=' + Date.now();
    var get = function (f) {
      return fetch(f + v).then(function (r) {
        if (!r.ok) throw new Error(f + ': HTTP ' + r.status);
        return r.json();
      });
    };
    window.__saContent = Promise.all([get('site.json'), get('works.json')]);
    window.__saContent.catch(function () {});
  } catch (e) {}
})();
</script>
