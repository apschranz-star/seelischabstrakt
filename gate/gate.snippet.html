<script>
(function(){
  var KEY="__ACCESS_KEY__";
  if(!KEY||KEY.indexOf("__")===0)return;
  var STORE="sa-access",PARAM="zugang",q=null;
  try{q=new URLSearchParams(location.search).get(PARAM);}catch(e){}
  var ok=false;
  try{if(q===KEY){localStorage.setItem(STORE,KEY);}ok=localStorage.getItem(STORE)===KEY;}catch(e){ok=q===KEY;}
  /* Der Code gehoert nicht in die Adresszeile und damit nicht in die Server-Logs des Hosters.
     Sobald er geprueft ist, wird er aus der URL entfernt. */
  if(q!==null){try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}}
  if(ok)return;
  document.documentElement.setAttribute("data-gated","");
  var m=document.createElement("meta");m.name="robots";m.content="noindex,nofollow";document.head.appendChild(m);
  var open=function(){
    try{localStorage.setItem(STORE,KEY);}catch(e){}
    location.reload();
  };
  document.addEventListener("DOMContentLoaded",function(){
    var f=document.createElement("form");f.id="sa-gate";f.method="get";f.action=location.pathname;f.setAttribute("lang","de");
    f.innerHTML='<p class="k">Zugang &middot; Access</p><h1>__SITE_NAME__</h1>'
      +'<p>Diese Seite ist nicht &ouml;ffentlich. Bitte den Zugangscode eingeben.<br><span lang="en">This page is not public. Please enter the access code.</span></p>'
      +'<label for="sa-gate-code">Zugangscode &middot; <span lang="en">Access code</span></label>'
      +'<input id="sa-gate-code" name="'+PARAM+'" type="password" autocomplete="off" required autofocus>'
      +'<button type="submit">&Ouml;ffnen &middot; <span lang="en">Open</span></button>'
      +'<p class="e" role="alert" hidden>Der Code stimmt nicht. <span lang="en">The code is not correct.</span></p>'
      /* Wer eine Seite betreibt und was sie speichert, steht vor dem Zugang, nicht dahinter.
         Art. 13 DSGVO gilt auch fuer diese Ansicht. */
      +'<details class="n"><summary>Wer diese Seite betreibt und was gespeichert wird &middot; <span lang="en">Who runs this page and what is stored</span></summary>'
      +'<p>Nicht &ouml;ffentliche Vorschau von __OPERATOR__.__CONTACT_LINE__ Diese Ansicht legt nur den Zugang im lokalen Speicher deines Browsers ab, damit du den Code nicht jedes Mal eingeben musst. Das ist f&uuml;r den gew&uuml;nschten Dienst unbedingt erforderlich und braucht keine Einwilligung. Die Seite liegt bei GitHub Inc., USA, deren Server beim Aufruf die IP-Adresse protokollieren, Art. 6 Abs. 1 lit. f DSGVO. Kein Tracking, keine Cookies von Dritten, keine Schriften von fremden Servern. Impressum und Datenschutzerkl&auml;rung stehen auf der Seite selbst.</p>'
      +'<p lang="en">Private preview by __OPERATOR__. This screen only keeps your access in your browser storage so you do not have to type the code again. That storage is strictly necessary for the service you asked for and needs no consent. The page is hosted by GitHub Inc., USA, whose servers log your IP address on each request, Art. 6 (1) (f) GDPR. No tracking, no third party cookies, no fonts from other servers. The imprint and the privacy policy are on the page itself.</p>'
      +'</details>';
    if(q!==null){var e=f.querySelector(".e");if(e)e.hidden=false;}
    /* Mit JavaScript wird im Feld geprueft. Ohne JavaScript bleibt das GET-Formular der Weg. */
    f.addEventListener("submit",function(ev){
      var v=(f.querySelector("#sa-gate-code")||{}).value;
      if(v===KEY){ev.preventDefault();open();return;}
      ev.preventDefault();
      var e=f.querySelector(".e");if(e)e.hidden=false;
      var i=f.querySelector("#sa-gate-code");if(i){i.value="";i.focus();}
    });
    document.body.appendChild(f);
  });
})();
</script>
