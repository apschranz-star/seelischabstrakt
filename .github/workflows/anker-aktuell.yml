# Erneuert einmal im Monat die Forschungsuebersicht von Anker (anker/aktuell.js)
# aus PubMed und die glutenfreien Rezepte aus dem Netz (anker/rezepte-netz.js)
# und veroeffentlicht die App danach neu.
#
# Warum hier und nicht in der App: die App darf keine Verbindung nach draussen
# aufbauen (connect-src 'none'), weil sie Gesundheitsdaten traegt. Also holt
# dieser Lauf die Daten auf GitHub, legt sie als Datei neben die App, und das
# Telefon laedt sie von derselben Adresse wie alles andere. Was gesucht wird,
# steht in anker/module.js unter forschung, wie gesucht wird, in
# anker/werkzeug/aktualisieren.js.
#
# Ein Push mit dem GITHUB_TOKEN startet keine weiteren Workflows. Deshalb stoesst
# dieser Lauf "Publish Anker" am Ende ausdruecklich an.
name: Refresh Anker research and recipes

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: anker-aktuell
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the research overview from PubMed
        run: node anker/werkzeug/aktualisieren.js
      # Rezepte: faellt eine Quelle aus, bleibt die alte Datei stehen und die
      # Forschung wird trotzdem veroeffentlicht.
      - name: Collect gluten free recipes
        continue-on-error: true
        run: node anker/werkzeug/rezepte-holen.js
      - name: Check it before anything is committed
        run: |
          node --check anker/aktuell.js
          node --check anker/rezepte-netz.js
          node anker/werkzeug/pruefe-module.js
      - name: Commit, if anything changed
        id: commit
        run: |
          if git diff --quiet -- anker/aktuell.js anker/rezepte-netz.js; then
            echo "Nichts Neues."
            echo "neu=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anker/aktuell.js anker/rezepte-netz.js
          git commit -q -m "Anker: Forschung und Rezepte $(date -u +%Y-%m)"
          for try_ in 1 2 3 4 5 6 7 8; do
            if git push -q origin HEAD:main; then echo "neu=ja" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull -q --rebase origin main
          done
          echo "::error::main liess sich nach acht Versuchen nicht beschreiben."
          exit 1
      - name: Publish Anker again
        if: steps.commit.outputs.neu == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/anker-pages.yml/dispatches" \
            -d '{"ref":"main"}'
