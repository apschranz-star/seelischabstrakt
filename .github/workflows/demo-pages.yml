# Rebuilds the gated static demo after every push to the branch jing and publishes it
# to the branch gh-pages under jing/. This is what makes a change by the GPT visible
# without anyone running a build by hand.
#
# The access code is the one code for every gated site: the repository secret
# SITE_ACCESS_KEY when it exists, otherwise gate/access-code.txt on main. Without
# either nothing is published, so the demo never goes live without its gate.
#
# Once JING moves to its own repository, gh-pages of that repository takes over and
# the two checkout steps below lose their `repository` line.
name: Publish the JING demo

on:
  push:
    branches: [jing]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jing-demo-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Der Zugangscode steht schon in der veroeffentlichten Demo, im Bundle neben dem
      # Schluessel jing-access. Ihn dort zu lesen ist verlaesslicher als ein Secret, das
      # jemand erst anlegen muss, und er wird nirgends abgelegt. Findet der Lauf keinen
      # Code, bricht er ab und veroeffentlicht nichts, statt die Demo offen zu stellen.
      # Der Ordner heisst nicht pages: Next.js wuerde jeden Ordner dieses Namens im
      # Projekt fuer seinen Pages-Router halten und am Export scheitern.
      - name: Check out the published branch
        uses: actions/checkout@v4
        with:
          repository: apschranz-star/seelischabstrakt
          ref: gh-pages
          path: published

      - name: Read the access code, secret first, published demo second
        env:
          SECRET: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          KEY="$SECRET"
          if [ -z "$KEY" ] && [ -d published/jing/_next/static/chunks ]; then
            KEY="$(node -e 'const fs=require("fs"),path=require("path");const dir="published/jing/_next/static/chunks";const re=/"([A-Za-z0-9_-]{6,64})"\s*,\s*[A-Za-z_$][\w$]*\s*=\s*"jing-access"/;for(const f of fs.readdirSync(dir)){const p=path.join(dir,f);if(!fs.statSync(p).isFile())continue;const m=fs.readFileSync(p,"utf8").match(re);if(m){process.stdout.write(m[1]);process.exit(0);}}process.exit(1);' || true)"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Kein Zugangscode gefunden, weder als Secret noch in der veroeffentlichten Demo. Nichts veroeffentlicht."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the static demo with the gate
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          scripts/build-static-demo.sh /seelischabstrakt/jing https://apschranz-star.github.io/seelischabstrakt/jing "$KEY"
          test -f out/index.html

      - name: Replace only the folder jing on the branch
        run: |
          rm -rf published/jing
          mkdir -p published/jing
          cp -R out/. published/jing/
          touch published/.nojekyll
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "demo already current"; exit 0; fi
          git commit -q -m "Publish the JING demo from ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
          echo "demo updated"
