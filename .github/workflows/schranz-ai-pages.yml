# Builds the SCHRANZ AI site from schranz-ai/content.json and publishes it to the
# branch gh-pages under schranz-ai/, next to the practice site and the JING demo.
name: Publish the Schranz AI site

on:
  push:
    branches: [main]
    paths:
      - "schranz-ai/**"
      - "gate/**"
      - ".github/workflows/schranz-ai-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schranz-ai-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the current published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Read the access code, secret first, published site second
        env:
          KEY: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          # Der Zugangscode kommt aus dem Repository-Secret SITE_ACCESS_KEY, wie bei den
          # anderen drei Seiten. Fehlt das Secret, wird er aus der zuletzt veroeffentlichten
          # Seite zurueckgelesen. Das || true ist noetig: ohne es stirbt der Schritt am rohen
          # Fehler von node, und die verstaendliche Meldung darunter wird nie erreicht.
          # Der Platzhalter zaehlt nicht als Code, er wuerde das Tor abschalten.
          if [ -z "$KEY" ] && [ -f "pages/schranz-ai/index.html" ]; then
            KEY="$(node -e 'const fs=require("fs"); const s=fs.readFileSync("pages/schranz-ai/index.html","utf8"); const m=s.match(/var KEY="([A-Za-z0-9_-]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);' || true)"
          fi
          case "$KEY" in __*) KEY="" ;; esac
          if [ -z "$KEY" ]; then
            echo "::error::Kein Zugangscode gefunden, weder als Secret noch in der veroeffentlichten Seite. Nichts veroeffentlicht. Abhilfe: Repository-Secret SITE_ACCESS_KEY anlegen."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SITE_ACCESS_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Build both languages, behind the existing access code
        run: |
          cd schranz-ai
          SITE_BASE=/seelischabstrakt/schranz-ai \
          SITE_URL=https://apschranz-star.github.io/seelischabstrakt/schranz-ai \
          SITE_ACCESS_KEY="$SITE_ACCESS_KEY" node build.mjs
          test -f dist/index.html && test -f dist/en/index.html
      - name: Replace only the folder schranz-ai on the branch
        run: |
          rm -rf pages/schranz-ai
          mkdir -p pages/schranz-ai
          cp -R schranz-ai/dist/. pages/schranz-ai/
          cd pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already current"; exit 0; fi
          git commit -q -m "Publish the Schranz AI site from ${GITHUB_SHA::7}"
          # Fuenf Workflows schreiben denselben Zweig. Laeuft ein zweiter gleichzeitig,
          # weist git den Push ab; ohne Nachziehen bliebe die Aenderung liegen.
          for try_ in 1 2 3; do
            if git push -q origin HEAD:gh-pages; then echo "gh-pages updated"; exit 0; fi
            echo "Push abgewiesen, Versuch $try_. Zweig wird nachgezogen."
            git fetch -q origin gh-pages
            git rebase -q origin/gh-pages || { git rebase --abort || true; exit 1; }
          done
          echo "::error::Der Zweig gh-pages liess sich nach drei Versuchen nicht beschreiben."
          exit 1
