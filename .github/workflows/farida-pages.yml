# Keeps the branch gh-pages in sync with the folder farida/, so GitHub Pages can serve the
# practice site with "Deploy from a branch". Independent of Netlify and of the Pages API.
name: Publish the practice site

on:
  push:
    branches: [main]
    paths:
      - "farida/**"
      - ".github/workflows/farida-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farida-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the content file is valid JSON
        run: python3 -c "import json;json.load(open('farida/content.json'));print('content.json ok')"
      - name: Check out the branch gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Replace the practice site, keep everything else on the branch
        # The branch also carries the JING demo under jing/ (published by hand), the Schranz AI
        # site under schranz-ai/, the portfolio under portfolio/ and the art shop preview under
        # shop/ (each its own workflow).
        # Only the practice site is replaced here.
        env:
          KEY: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Secret SITE_ACCESS_KEY fehlt. Nichts veroeffentlicht, damit keine offene Fassung die geschuetzte ersetzt. Anlegen unter Settings, Secrets and variables, Actions."
            exit 0
          fi
          cd pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name jing ! -name schranz-ai ! -name portfolio ! -name shop -exec rm -rf {} +
          cp -R ../farida/. .
          rm -f netlify.toml README.md
          sh ../gate/inject.sh index.html "$KEY"
          # Die Vorschau ist nicht die oeffentliche Seite. Die robots.txt der Praxisseite gilt auf
          # deren echter Adresse, hier wird sie durch eine ersetzt, die Suchmaschinen fernhaelt.
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          rm -f sitemap.xml
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already current"; exit 0; fi
          git commit -q -m "Publish the practice site from ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
          echo "gh-pages updated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
