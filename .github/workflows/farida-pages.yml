# Keeps the branch gh-pages in sync with the folder farida/, so GitHub Pages can serve the
# practice site with "Deploy from a branch". Independent of Netlify and of the Pages API.
name: Publish the practice site

on:
  push:
    branches: [main]
    paths:
      - "farida/**"
      - ".github/workflows/farida-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farida-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the content file is valid JSON
        run: python3 -c "import json;json.load(open('farida/content.json'));print('content.json ok')"
      - name: Push the folder to the gh-pages branch
        run: |
          cd farida
          rm -f netlify.toml README.md
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the practice site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
          echo "gh-pages updated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
