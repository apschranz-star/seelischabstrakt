# Keeps gh-pages/portfolio in sync with portfolio/, so the newest personal page
# can be viewed directly from GitHub Pages, independently of Netlify.
name: Publish the Behind the Artist page

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "gate/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the journal file is valid JSON
        run: python3 -c "import json;json.load(open('portfolio/journal.json'));print('journal.json ok')"
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Replace only the portfolio preview
        env:
          KEY: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          # Der Zugangscode kommt aus dem Repository-Secret SITE_ACCESS_KEY. Fehlt das
          # Secret, wird er aus der zuletzt veroeffentlichten Seite zurueckgelesen. Der
          # Platzhalter zaehlt nicht als Code: er passt auf dasselbe Muster, wuerde das Tor
          # aber abschalten und die Seite mit gruenem Lauf offen ins Netz stellen.
          if [ -z "$KEY" ] && [ -f "pages/portfolio/index.html" ]; then
            KEY="$(node -e 'const fs=require("fs"); const s=fs.readFileSync("pages/portfolio/index.html","utf8"); const m=s.match(/var KEY="([A-Za-z0-9_-]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);' || true)"
          fi
          case "$KEY" in __*) KEY="" ;; esac
          if [ -z "$KEY" ]; then
            echo "::error::Kein Zugangscode gefunden, weder als Secret noch in der veroeffentlichten Seite. Nichts veroeffentlicht. Abhilfe: Repository-Secret SITE_ACCESS_KEY anlegen."
            exit 1
          fi
          echo "::add-mask::$KEY"
          rm -rf pages/portfolio
          mkdir -p pages/portfolio
          cp -R portfolio/. pages/portfolio/
          # Wie bei der Praxisseite: die Vorschau ist nicht die oeffentliche Seite, also
          # gelten deren robots.txt und sitemap.xml hier nicht.
          rm -f pages/portfolio/netlify.toml pages/portfolio/README.md
          rm -f pages/portfolio/robots.txt pages/portfolio/sitemap.xml
          sh gate/inject.sh pages/portfolio/index.html "$KEY"
          touch pages/.nojekyll
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "portfolio preview already current"; exit 0; fi
          git commit -q -m "Publish Behind the Artist from ${GITHUB_SHA::7}"
          # Fuenf Workflows schreiben denselben Zweig. Laeuft ein zweiter gleichzeitig,
          # weist git den Push ab; ohne Nachziehen bliebe die Aenderung liegen.
          for try_ in 1 2 3; do
            if git push -q origin HEAD:gh-pages; then echo "portfolio preview updated"; exit 0; fi
            echo "Push abgewiesen, Versuch $try_. Zweig wird nachgezogen."
            git fetch -q origin gh-pages
            git rebase -q origin/gh-pages || { git rebase --abort || true; exit 1; }
          done
          echo "::error::Der Zweig gh-pages liess sich nach drei Versuchen nicht beschreiben."
          exit 1
