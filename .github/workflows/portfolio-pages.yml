# Keeps gh-pages/portfolio in sync with portfolio/, so the newest personal page
# can be viewed directly from GitHub Pages, independently of Netlify.
name: Publish the Behind the Artist page

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Replace only the portfolio preview
        env:
          KEY: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          # Der Zugangscode steht schon in der veroeffentlichten Seite. Ihn dort zu lesen ist
          # verlaesslicher als ein Secret, das jemand erst anlegen muss, und er wird nirgends
          # abgelegt. Ein Secret SITE_ACCESS_KEY hat Vorrang, falls es doch eines gibt.
          if [ -z "$KEY" ] && [ -f "pages/portfolio/index.html" ]; then
            KEY="$(node -e 'const fs=require("fs"); const s=fs.readFileSync("pages/portfolio/index.html","utf8"); const m=s.match(/var KEY="([A-Za-z0-9_-]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);' || true)"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Kein Zugangscode gefunden, weder als Secret noch in der veroeffentlichten Seite. Nichts veroeffentlicht."
            exit 1
          fi
          echo "::add-mask::$KEY"
          rm -rf pages/portfolio
          mkdir -p pages/portfolio
          cp -R portfolio/. pages/portfolio/
          rm -f pages/portfolio/netlify.toml pages/portfolio/README.md
          sh gate/inject.sh pages/portfolio/index.html "$KEY"
          touch pages/.nojekyll
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "portfolio preview already current"; exit 0; fi
          git commit -q -m "Publish Behind the Artist from ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
          echo "portfolio preview updated"
