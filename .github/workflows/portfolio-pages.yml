# Keeps gh-pages/portfolio in sync with portfolio/, so the newest personal page
# can be viewed directly from GitHub Pages, independently of Netlify.
name: Publish the Behind the Artist page

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Replace only the portfolio preview
        env:
          KEY: ${{ secrets.SITE_ACCESS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Secret SITE_ACCESS_KEY fehlt. Nichts veroeffentlicht, damit keine offene Fassung die geschuetzte ersetzt. Anlegen unter Settings, Secrets and variables, Actions."
            exit 0
          fi
          rm -rf pages/portfolio
          mkdir -p pages/portfolio
          cp -R portfolio/. pages/portfolio/
          rm -f pages/portfolio/netlify.toml pages/portfolio/README.md
          sh gate/inject.sh pages/portfolio/index.html "$KEY"
          touch pages/.nojekyll
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "portfolio preview already current"; exit 0; fi
          git commit -q -m "Publish Behind the Artist from ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
          echo "portfolio preview updated"
