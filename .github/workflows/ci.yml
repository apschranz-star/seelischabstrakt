# Every push and pull request has to pass the same checks a contributor runs
# locally. A red build here is the earliest, cheapest place to catch it.
#
# The static export is built as well, because that, not the server build, is what
# is actually published today. The two differ enough to break separately: the
# export has no route handlers, no image optimiser and no response headers.
name: CI

on:
  push:
    branches: [main, jing]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build the static export, the build that is published
        run: scripts/build-static-demo.sh /seelischabstrakt/jing https://apschranz-star.github.io/seelischabstrakt/jing
