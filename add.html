<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neues Werk · seelischabstrakt</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
body{margin:0;background:#8C1D1D;color:#EFE7D8;font:16px/1.5 "Courier Prime",monospace;padding:16px;min-height:100vh}
.card{background:#F1EBE0;color:#171212;border:8px solid #0D0A0A;padding:18px;max-width:520px;margin:auto;display:grid;gap:12px}
h1{font-size:20px;margin:0}label{display:grid;gap:4px;font-size:12px;color:#6b5a55}input,textarea,select{font:16px "Courier Prime",monospace;padding:10px;border:1px solid #cbbfae;width:100%;box-sizing:border-box;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{font:700 15px "Courier Prime",monospace;padding:14px;border:0;background:#0D0A0A;color:#EFE7D8;width:100%;cursor:pointer}.btn.light{background:#EFE7D8;color:#0D0A0A;border:1px solid #0D0A0A}
.shot{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0D0A0A;display:none}.status{font-size:13px;color:#6b5a55;min-height:1.2em}.ok{color:#2f6b3a}.warn{color:#8C1D1D}
</style></head><body>
<form class="card" id="f">
  <h1>Neues Werk</h1>
  <img class="shot" id="shot" alt="">
  <div class="two"><button class="btn" type="button" id="cam">Foto aufnehmen</button><button class="btn light" type="button" id="pick">Foto wählen</button></div>
  <input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fpick" accept="image/*" hidden>
  <label>Titel<input id="title" required></label>
  <div class="two"><label>Breite cm<input id="w" type="number" step="0.5" required></label><label>Höhe cm<input id="h" type="number" step="0.5" required></label></div>
  <div class="two"><label>Preis Original EUR<input id="price" type="number" required></label><label>Jahr<input id="year" type="number" value=""></label></div>
  <label>Technik (DE)<input id="mde" placeholder="Acryl auf Papier, gerahmt"></label>
  <label>Technik (EN)<input id="men" placeholder="Acrylic on paper, framed"></label>
  <label>Caption (DE, optional)<textarea id="cde" rows="2"></textarea></label>
  <label>Caption (EN, optional)<textarea id="cen" rows="2"></textarea></label>
  <div class="two"><label>Rahmen und Passepartout<select id="nomat"><option value="false">ja, Seite rahmt</option><option value="true">nein, Foto zeigt Setting</option></select></label><label>Druckgrößen<select id="prints"><option value="">keine</option><option value="30">30 × 40 (95)</option><option value="30,50">30 × 40 und 50 × 70</option><option value="30,50,70">alle drei</option></select></label></div>
  <label>Aus ChatGPT einfügen (optional): JSON-Block hier hineinkopieren, die Felder oben füllen sich von selbst<textarea id="paste" rows="3" placeholder='{"title":"Kopf, rot","w":30,"h":24,"price":380,"medium":{"de":"…","en":"…"},"caption":{"de":"…","en":"…"},"prints":[{"size":"30 × 40","price":95}]}'></textarea></label>
  <label>Desk-Schlüssel<input id="key" type="password" autocomplete="off"></label>
  <button class="btn" type="submit" id="go">Veröffentlichen</button>
  <div class="status" id="st"></div>
</form>
<script>
const $=s=>document.querySelector(s); let photo=null; try{ $("#key").value=localStorage.getItem("desk-key")||""; }catch(e){}
$("#year").value=new Date().getFullYear();
$("#cam").onclick=()=>$("#fcam").click(); $("#pick").onclick=()=>$("#fpick").click();
async function load(file){ if(!file) return; const img=new Image(); img.onload=()=>{ const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); photo=c.toDataURL("image/jpeg",.86); $("#shot").src=photo; $("#shot").style.display="block"; if(!$("#w").value){ $("#w").value=30; $("#h").value=Math.round(30*c.height/c.width*2)/2; } URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); }
$("#fcam").onchange=e=>load(e.target.files[0]); $("#fpick").onchange=e=>load(e.target.files[0]);
let pastedPrints=null;
$("#paste").oninput=()=>{ const raw=$("#paste").value.trim(); if(!raw) { pastedPrints=null; return; } try{ const j=JSON.parse(raw.replace(/^```(json)?|```$/g,"").trim()); const w=j.work||j;
  if(w.title) $("#title").value=w.title; if(w.w) $("#w").value=w.w; if(w.h) $("#h").value=w.h; if(w.price!==undefined) $("#price").value=w.price; else if(w.original?.price!==undefined) $("#price").value=w.original.price; if(w.year) $("#year").value=w.year;
  const m=w.medium||{}; $("#mde").value=typeof m==="string"?m:(m.de||""); $("#men").value=typeof m==="string"?"":(m.en||""); const c=w.caption||{}; $("#cde").value=typeof c==="string"?c:(c.de||""); $("#cen").value=typeof c==="string"?"":(c.en||"");
  if(w.nomat!==undefined) $("#nomat").value=String(!!w.nomat); pastedPrints=Array.isArray(w.prints)?w.prints:null; if(pastedPrints){ $("#prints").value=""; }
  $("#st").className="status ok"; $("#st").textContent="Block übernommen. Foto wählen, Schlüssel eingeben, veröffentlichen."; }catch(err){ $("#st").className="status warn"; $("#st").textContent="Block nicht lesbar: "+err.message; } };
const TIERS={"30":{size:"30 × 40",price:95},"50":{size:"50 × 70",price:190},"70":{size:"70 × 100",price:340}};
$("#f").onsubmit=async e=>{ e.preventDefault(); const st=$("#st"); st.className="status"; st.textContent="Wird veröffentlicht…"; $("#go").disabled=true;
  try{ localStorage.setItem("desk-key",$("#key").value); }catch(e){}
  const body={ action:"add", title:$("#title").value.trim(), w:Number($("#w").value), h:Number($("#h").value), year:Number($("#year").value)||undefined, price:Number($("#price").value), available:true, nomat:$("#nomat").value==="true",
    medium:{de:$("#mde").value.trim(),en:$("#men").value.trim()||$("#mde").value.trim()}, caption:{de:$("#cde").value.trim(),en:$("#cen").value.trim()},
    prints:pastedPrints?pastedPrints.map(p=>({size:p.size,price:Number(p.price),link:p.link||""})):($("#prints").value?$("#prints").value.split(","):[]).map(k=>({...TIERS[k],link:""})), imageBase64:photo||undefined };
  try{ const r=await fetch("/api/works",{method:"POST",headers:{"Content-Type":"application/json","x-desk-key":$("#key").value},body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    st.className="status ok"; st.textContent=j.message; $("#f").reset(); $("#year").value=new Date().getFullYear(); photo=null; pastedPrints=null; $("#shot").style.display="none"; try{ $("#key").value=localStorage.getItem("desk-key"); }catch(e){}
  }catch(err){ st.className="status warn"; st.textContent="Fehler: "+err.message; }
  $("#go").disabled=false; };
</script></body></html>
