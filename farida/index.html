<script>
(function(){
  var KEY="__ACCESS_KEY__";
  if(!KEY||KEY.indexOf("__")===0)return;
  var STORE="sa-access",PARAM="zugang",q=null;
  try{q=new URLSearchParams(location.search).get(PARAM);}catch(e){}
  var ok=false;
  try{if(q===KEY){localStorage.setItem(STORE,KEY);}ok=localStorage.getItem(STORE)===KEY;}catch(e){ok=q===KEY;}
  /* Der Code wird aus der Adresszeile genommen, sobald er geprueft ist: was der
     Besucher danach kopiert oder weitergibt, traegt ihn nicht mehr, und er steht
     in keinem Verlauf und in keinem Referrer der naechsten Seite. Im Protokoll
     des Hosters steht er trotzdem, denn die erste Anfrage ging mit ihm hinaus.
     Nur der Parameter zugang wird entfernt; alle anderen bleiben stehen, sonst
     reisst das Tor jeden Deep Link der Seite mit. */
  if(q!==null){try{var u=new URL(location.href);u.searchParams.delete(PARAM);history.replaceState(null,"",u.pathname+u.search+u.hash);}catch(e){}}
  if(ok)return;
  /* Kein noindex von hier: die Anweisung steht schon fest in der Datei, gesetzt
     beim Veroeffentlichen von gate/inject.sh und von schranz-ai/build.mjs. Das
     ist der einzige Weg, der auch bei einem Crawler ohne JavaScript haelt, und
     zweimal dasselbe im Kopf ist eine Zeile, die auseinanderlaufen kann. */
  document.documentElement.setAttribute("data-gated","");
  var open=function(){
    /* Erst schreiben, dann nachsehen, ob es angekommen ist. Ein Browser im
       privaten Fenster oder mit gesperrtem Speicher nimmt nichts an; ein Neuladen
       faende dann wieder nichts und stellte dieselbe Maske hin, also oeffnet sich
       die Seite in diesem Fall hier, fuer diesen Besuch. */
    var kept=false;
    try{localStorage.setItem(STORE,KEY);kept=localStorage.getItem(STORE)===KEY;}catch(e){}
    if(kept){location.reload();return;}
    var f=document.getElementById("sa-gate");
    if(f&&f.parentNode)f.parentNode.removeChild(f);
    document.documentElement.removeAttribute("data-gated");
  };
  document.addEventListener("DOMContentLoaded",function(){
    var f=document.createElement("form");f.id="sa-gate";f.setAttribute("lang","de");
    f.innerHTML='<p class="k">Zugang &middot; Access</p><h1>Studio Farida</h1>'
      +'<p>Diese Seite ist nicht &ouml;ffentlich. Bitte den Zugangscode eingeben.<br><span lang="en">This page is not public. Please enter the access code.</span></p>'
      +'<label for="sa-gate-code">Zugangscode &middot; <span lang="en">Access code</span></label>'
      +'<input id="sa-gate-code" name="'+PARAM+'" type="password" autocomplete="off" required autofocus>'
      +'<button type="submit">&Ouml;ffnen &middot; <span lang="en">Open</span></button>'
      +'<p class="e" role="alert" hidden>Der Code stimmt nicht. <span lang="en">The code is not correct.</span></p>'
      /* Wer eine Seite betreibt und was sie speichert, steht vor dem Zugang, nicht dahinter.
         Art. 13 DSGVO gilt auch fuer diese Ansicht. */
      +'<details class="n"><summary>Wer diese Seite betreibt und was gespeichert wird &middot; <span lang="en">Who runs this page and what is stored</span></summary>'
      +'<p>Nicht &ouml;ffentliche Vorschau von Farida Benslimane, Acquapendente. Diese Ansicht legt nur den Zugang im lokalen Speicher deines Browsers ab, damit du den Code nicht jedes Mal eingeben musst. Das ist f&uuml;r den gew&uuml;nschten Dienst unbedingt erforderlich und braucht keine Einwilligung. Die Seite liegt bei GitHub Inc., USA, deren Server beim Aufruf die IP-Adresse protokollieren, Art. 6 Abs. 1 lit. f DSGVO. Kein Tracking, keine Cookies von Dritten, keine Schriften von fremden Servern. Impressum und Datenschutzerkl&auml;rung stehen auf der Seite selbst.</p>'
      +'<p lang="en">Private preview by Farida Benslimane, Acquapendente. This screen only keeps your access in your browser storage so you do not have to type the code again. That storage is strictly necessary for the service you asked for and needs no consent. The page is hosted by GitHub Inc., USA, whose servers log your IP address on each request, Art. 6 (1) (f) GDPR. No tracking, no third party cookies, no fonts from other servers. The imprint and the privacy policy are on the page itself.</p>'
      +'</details>';
    if(q!==null){var e=f.querySelector(".e");if(e)e.hidden=false;}
    /* Geprueft wird hier im Feld, deshalb hat der Knopf kein Ziel: das Formular
       wird nie abgeschickt. Ohne JavaScript gibt es weder diese Maske noch die
       Sperre darunter, die Seite liegt dann offen. Das Tor haelt Suchmaschinen
       und Zufallsbesucher fern, es ist kein Schutz. Siehe gate/README.md. */
    f.addEventListener("submit",function(ev){
      var v=(f.querySelector("#sa-gate-code")||{}).value;
      if(v===KEY){ev.preventDefault();open();return;}
      ev.preventDefault();
      var e=f.querySelector(".e");if(e)e.hidden=false;
      var i=f.querySelector("#sa-gate-code");if(i){i.value="";i.focus();}
    });
    document.body.appendChild(f);
  });
})();

<style>
:root{
  --navy-900:#1B1430; --navy-800:#2A2047; --navy-700:#3E2F63;
  --paper:#FBF8F4; --paper-2:#FFFFFF; --paper-3:#F4EFE7;
  --ink:#20182C; --ink-2:#544B62; --ink-3:#736A82; --line:#E8E0D4; --line-2:#D3C7B5;
  --accent:#8A6526; --accent-2:#C9A961; --accent-soft:#F4EEE2; --accent-ink:#7C5C24; --on-accent:#0A1B2E;
  --shadow-s:0 1px 2px rgba(9,26,48,.06), 0 4px 14px -6px rgba(9,26,48,.16);
  --shadow-m:0 2px 4px rgba(9,26,48,.06), 0 18px 44px -22px rgba(9,26,48,.4);
  --r:14px; --wrap:min(100% - 36px, 1120px);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Cormorant Garamond",Georgia,serif;
  --font-ar:"IBM Plex Sans Arabic","Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#130E20; --paper-2:#1B1530; --paper-3:#221A3A;
  --ink:#F2ECE2; --ink-2:#C6BCD2; --ink-3:#9C93AC; --line:#2B2342; --line-2:#3C3257;
  --accent:#C9A961; --accent-2:#E0C88C; --accent-soft:#1C2432; --accent-ink:#DFC488; --on-accent:#0A1B2E;
  --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-m:0 20px 50px -26px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --paper:#130E20; --paper-2:#1B1530; --paper-3:#221A3A;
  --ink:#F2ECE2; --ink-2:#C6BCD2; --ink-3:#9C93AC; --line:#2B2342; --line-2:#3C3257;
  --accent:#C9A961; --accent-2:#E0C88C; --accent-soft:#1C2432; --accent-ink:#DFC488; --on-accent:#0A1B2E;
  --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-m:0 20px 50px -26px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
/* Auf Arabisch gilt die arabische Schrift ueberall, auch dort, wo eine Regel
   ausdruecklich --display verlangt: Cormorant Garamond hat keine arabischen
   Zeichen, und die Leistungsnamen fielen deshalb aus der Schrift heraus. Eine
   Zeile statt einer Ausnahme je Selektor, damit die naechste Regel mit
   --display nicht wieder vergessen wird. */
html[dir="rtl"]{--display:var(--font-ar)}
html[dir="rtl"] body{font-family:var(--font-ar);line-height:1.9}
.wrap{width:var(--wrap);margin-inline:auto}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em;font-weight:500;font-family:var(--display)}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:var(--font-ar);font-weight:600;letter-spacing:0}
p{margin:0 0 16px}
a{color:inherit}
img{max-width:100%}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{inset-inline-start:12px;top:12px;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:99;border-radius:8px}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}

/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header::after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,97,.55),transparent)}

  background:var(--navy-900);color:var(--accent-2);border:1px solid var(--accent);box-shadow:var(--shadow-s)}
.lockup>span:not(.mark){min-width:0;flex:1 1 auto}
.lockup .nm{display:block;font-family:var(--display);font-weight:600;font-size:17px;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (min-width:760px){ .places{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))} }
.place{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.place::before{content:"";position:absolute;inset-block-start:0;inset-inline-start:0;width:100%;height:2px;background:linear-gradient(90deg,#C9A961,rgba(201,169,97,0))}
.place h3{font-size:1.3rem;margin-bottom:14px}
.place address{font-style:normal;color:var(--ink-2);font-size:16px}
.hours{margin:16px 0 0;padding:0;list-style:none;font-size:15px;color:var(--ink-2)}
.hours li{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line)}
.linkline{margin:14px 0 0;font-size:14.5px}
.linkline a{color:var(--accent);font-weight:600}
.contactbox{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}

/* floating actions */
.fab{position:fixed;inset-inline:0;inset-block-end:0;z-index:45;display:flex;align-items:center;gap:6px;
  padding:9px max(12px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--paper-2) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  box-shadow:0 -10px 30px -22px rgba(10,27,46,.6)}
.fab .ico{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);text-decoration:none;border:1px solid var(--line)}
.fab .ico:hover{color:var(--accent);border-color:var(--accent)}
.fab .ico svg{width:20px;height:20px}
.fab .ico.wa{color:#1EA855;border-color:rgba(30,168,85,.35)}
.fab .main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 18px;border-radius:100px;
  background:linear-gradient(135deg,#EBD5A0 0%,#C9A961 46%,#A9863F 100%);color:#2A1E0B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);text-decoration:none;font-size:15px;font-weight:600;letter-spacing:.01em}
.fab .main svg{width:17px;height:17px}
body{padding-bottom:76px}
@media (min-width:900px){ .fab{display:none} body{padding-bottom:0} }

footer{background:var(--navy-900);color:#B9CBDD;padding-block:44px 30px;font-size:14px}
footer a{color:#DCEBF5}
footer h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#7FA6C4;margin:0 0 10px;font-weight:700}
.foot-grid{display:grid;gap:28px}
@media (min-width:760px){ .foot-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* Die Datenschutzerklaerung ist laenger als die anderen Spalten und bekommt deshalb eine eigene Zeile. */
#f-privacy p{margin:0 0 9px;max-width:74ch}
#f-privacy p:last-child{margin-bottom:0}
@media (min-width:760px){ #f-privacy{grid-column:1/-1} }
.emergency{margin-top:30px;padding:14px 16px;border:1px solid rgba(185,203,221,.24);border-radius:10px;color:#CFE0EE}
.copy{margin-top:22px;color:#7FA6C4;font-size:13px}
.empty{color:var(--ink-3)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">→</a>
<header>
  <div class="bar">
    <a class="lockup" href="#top">
      <span class="mark" id="mark">FB</span>
      <span><span class="nm" id="who">Farida Benslimane</span><span class="rl" id="who-role"></span></span>
    </a>
    <nav class="main" id="nav" aria-label="Menu"></nav>
    <div class="tools">
      <a class="headcta" id="headcta" href="#practice"></a>
      <div class="langs" id="langs"></div>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="panel" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>
<div id="panel" role="dialog" aria-modal="true">
  <button class="burger close" id="panel-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <ul id="panel-nav"></ul>
  <div class="langs" id="panel-langs"></div>
</div>

<main id="main">
  <section class="hero plain" id="top">
    <div class="bg" id="hero-bg" hidden></div>
    <div class="wrap"><div class="inner">
      <img class="avatar" id="h-avatar" alt="" hidden>
      <span class="eyebrow" id="h-eyebrow" hidden></span>
      <h1 id="h-name">Farida Benslimane</h1>
      <p class="role" id="h-role" hidden></p>
      <p class="lead" id="h-lead" hidden></p>
      <div class="cta" id="h-cta"></div>
    </div></div>
  </section>

  <section class="trust" id="trust" hidden><div class="wrap"><div class="grid" id="trust-grid"></div></div></section>

  <section class="pad" id="approach" hidden><div class="wrap">
    <div class="head"><h2 id="approach-t"></h2><p id="approach-i"></p></div>
    <div class="quotes" id="approach-p"></div>
  </div></section>

  <section class="pad alt" id="expertise" hidden><div class="wrap">
    <div class="head"><p class="kicker" id="expertise-k"></p><h2 id="expertise-t"></h2></div>
    <ul class="chips plain" id="expertise-a"></ul>
    <p class="sub" id="expertise-ct" hidden></p>
    <ul class="chips" id="expertise-c"></ul>
  </div></section>

  <section class="pad" id="services" hidden><div class="wrap">
    <div class="head"><h2 id="services-t"></h2><p id="services-i" hidden></p></div>
    <ul class="svc" id="services-l"></ul>
    <p class="linkline" id="services-n" hidden></p>
  </div></section>

  <section class="pad alt" id="reviews" hidden><div class="wrap">
    <div class="head"><h2 id="reviews-t"></h2><p id="reviews-i" hidden></p></div>
    <p class="sub" id="reviews-qt" hidden></p>
    <div class="quotes" id="reviews-q"></div>
    <p class="sub" id="reviews-ot" hidden></p>
    <div class="quotes" id="reviews-o"></div>
    <p class="srcline" id="reviews-s" hidden></p>
  </div></section>

  <section class="pad" id="practice" hidden><div class="wrap">
    <div class="head"><h2 id="practice-t"></h2><p id="practice-i" hidden></p></div>
    <div class="places" id="practice-l"></div>
    <div class="contactbox" id="practice-cta"></div>
  </div></section>

  <section class="pad" id="preparing" hidden><div class="wrap"><p class="empty" id="preparing-t"></p></div></section>
</main>

<div class="fab" id="fab" hidden></div>

<footer><div class="wrap">
  <div class="foot-grid">
    <div id="f-contact"></div>
    <div id="f-legal" hidden></div>
    <div id="f-privacy"></div>
  </div>
  <p class="emergency" id="f-emergency"></p>
  <p class="copy" id="f-copy"></p>
</div></footer>

<script>
"use strict";
const LANGS=["it","en","de","fr","ar"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeUrl(u){ const s=String(u||"").trim(); if(!s) return "";
  if(/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if(/^(\/|\.\/|img\/|#)/.test(s)) return s; return ""; }
let D={}, lang="it";
const L=v=>{ if(v==null) return ""; if(typeof v==="string") return v; return v[lang]||v.it||v.en||""; };
const has=v=>!!L(v).trim();
const isPair=v=>v&&typeof v==="object"&&!Array.isArray(v);
const ltr=s=>`<bdi class="ltr">${esc(s)}</bdi>`;
const fill=(s,m)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>m[k]!==undefined?m[k]:"");
const nice=d=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||"")); if(!m) return String(d||"");
  try{ return new Intl.DateTimeFormat(lang,{day:"numeric",month:"long",year:"numeric"}).format(new Date(+m[1],+m[2]-1,+m[3])); }catch(e){ return d; } };
const live=o=>o&&o.draft!==true;
const U=k=>L(D.ui&&D.ui[k]);
const SVG={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.8-.6-3.1-1.3-5.1-4.4-5.3-4.6-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.1.1.6-.1 1.2z"/></svg>',
};
function setLang(l,store){
  lang=LANGS.includes(l)?l:"it";
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  if(store!==false){ try{ localStorage.setItem("fb-lang",lang); }catch(e){} }
  render();
}
function langBar(){
  for(const sel of ["#langs","#panel-langs"]){
    const box=$(sel); if(!box) continue; box.innerHTML="";
    LANGS.forEach(l=>{ const b=document.createElement("button"); b.type="button"; b.textContent=l.toUpperCase();
      b.setAttribute("aria-pressed",String(l===lang)); b.setAttribute("lang",l);
      b.addEventListener("click",()=>{ if(sel==="#panel-langs") openPanel(false); setLang(l); }); box.appendChild(b); });
  }
}
function initials(n){ return String(n||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"FB"; }

function renderHero(){
  const p=D.profile||{}, hero=$(".hero");
  $("#who").textContent=p.name||""; $("#mark").textContent=initials(p.name);
  const wr=$("#who-role"); wr.textContent=L(p.title); wr.hidden=!has(p.title);
  $("#h-name").textContent=p.name||"";
  const eb=$("#h-eyebrow"); eb.textContent=L(p.city); eb.hidden=!has(p.city);
  const role=$("#h-role"); role.textContent=L(p.title); role.hidden=!has(p.title);
  const lead=$("#h-lead"); lead.textContent=L(p.lead); lead.hidden=!has(p.lead);
  const av=$("#h-avatar"), asrc=safeUrl(p.photo);
  if(asrc){ av.src=asrc; av.alt=L(p.photoAlt)||p.name||"";
    const ms=/^(\d+)x(\d+)$/.exec(String(p.photoSize||"")); if(ms){ av.width=+ms[1]; av.height=+ms[2]; }
    av.hidden=false; } else av.hidden=true;
  const bg=$("#hero-bg"), src=safeUrl(p.heroImage);
  if(src){ bg.style.backgroundImage=`url("${src}")`; bg.hidden=false; hero.classList.remove("plain"); }
  else { bg.hidden=true; hero.classList.add("plain"); }
  const cta=$("#h-cta"); cta.innerHTML="";
  const add=(href,label,icon,ghost)=>{ const u=safeUrl(href); if(!u||!label) return;
    const a=document.createElement("a"); a.className="btn"+(ghost?" ghost":""); a.href=u;
    a.innerHTML=(icon||"")+"<span>"+esc(label)+"</span>";
    if(/^https?:/i.test(u)){ a.target="_blank"; a.rel="noopener"; } cta.appendChild(a); };
  add(p.bookingUrl,U("book"),SVG.cal);
  if(p.phone){ const a=document.createElement("a"); a.className="btn"+(safeUrl(p.bookingUrl)?" ghost":"");
    a.href="tel:"+String(p.phone).replace(/\s+/g,""); a.innerHTML=SVG.tel+`<span>${ltr(p.phone)}</span>`; cta.appendChild(a); }
  if(p.email) add("mailto:"+p.email,U("email"),SVG.mail,!!(safeUrl(p.bookingUrl)||p.phone));
  hero.classList.toggle("nocta",!cta.children.length);
}
function renderTrust(){
  const p=D.profile||{}, r=D.reviews||{}, e=D.expertise||{}, pc=D.practice||{}, box=$("#trust-grid"); box.innerHTML="";
  const card=(k,v,sub)=>{ const d=document.createElement("div"); d.className="tcard";
    d.innerHTML=`<div class="k">${esc(k)}</div><div class="v">${v}${sub?`<small>${esc(sub)}</small>`:""}</div>`; box.appendChild(d); };
  if(live(r)&&r.rating&&String(r.rating.value||"").trim()){
    const n=Math.max(0,Math.min(5,Math.round(parseFloat(String(r.rating.value).replace(",","."))||0)));
    card(U("trustRating"),`<span class="stars">${"★".repeat(n)}</span> ${esc(r.rating.value)}`,
         fill(L(r.rating.label),{v:r.rating.value,n:r.rating.count}));
  }
  const places=live(pc)?(pc.locations||[]).filter(l=>has(l.label)||l.zipCity):[];
  if(places.length) card(U("trustWhere"),esc(places.map(l=>L(l.label)||l.zipCity).join(" · ")));
  const areas=live(e)?(e.areas||[]).filter(has):[];
  if(areas.length) card(U("trustWhat"),esc(areas.map(L).join(" · ")));
  const langs=Array.isArray(p.languages)?p.languages.filter(Boolean):[];
  if(langs.length&&box.children.length<3) card(U("languages"),esc(langs.join(" · ")));
  $("#trust").hidden=!box.children.length;
}
function renderApproach(){
  const a=D.approach, s=$("#approach");
  if(!live(a)||!has(a.intro)){ s.hidden=true; return; }
  s.hidden=false; $("#approach-t").textContent=L(a.title); $("#approach-i").textContent=L(a.intro);
  const box=$("#approach-p"); box.innerHTML="";
  (a.points||[]).filter(pt=>has(pt.title)||has(pt.text)).forEach(pt=>{
    const d=document.createElement("blockquote");
    d.innerHTML=(has(pt.title)?`<h3>${esc(L(pt.title))}</h3>`:"")+(has(pt.text)?`<p>${esc(L(pt.text))}</p>`:"");
    box.appendChild(d); });
}
function renderExpertise(){
  const e=D.expertise, s=$("#expertise");
  const areas=(e?.areas||[]).filter(has), cond=(e?.conditions||[]).filter(has);
  if(!live(e)||(!areas.length&&!cond.length)){ s.hidden=true; return; }
  s.hidden=false; $("#expertise-k").textContent=""; $("#expertise-t").textContent=L(e.title);
  $("#expertise-a").innerHTML=areas.map(a=>`<li>${esc(L(a))}</li>`).join("");
  const ct=$("#expertise-ct"); ct.textContent=L(e.conditionsTitle); ct.hidden=!cond.length||!has(e.conditionsTitle);
  $("#expertise-c").innerHTML=cond.map(c=>`<li>${esc(L(c))}</li>`).join("");
}
function renderServices(){
  const sv=D.services, s=$("#services");
  const items=(sv?.items||[]).filter(i=>has(i.name));
  if(!live(sv)||!items.length){ s.hidden=true; return; }
  s.hidden=false; $("#services-t").textContent=L(sv.title);
  const i=$("#services-i"); i.textContent=L(sv.intro); i.hidden=!has(sv.intro);
  const ul=$("#services-l"); ul.innerHTML="";
  items.forEach(it=>{
    const price=(isPair(it.price)?L(it.price):String(it.price||"")).trim()||U("onRequest");
    const li=document.createElement("li");
    li.innerHTML=`<span class="nm">${esc(L(it.name))}</span><span class="pr">${ltr(price)}</span>`
      +(has(it.text)?`<span class="tx">${esc(L(it.text))}</span>`:"")
      +(it.duration?`<span class="du">${esc(U("duration"))}: ${ltr(it.duration)}</span>`:"");
    ul.appendChild(li); });
  const n=$("#services-n"); n.textContent=L(sv.note); n.hidden=!has(sv.note);
}
function renderReviews(){
  const r=D.reviews, s=$("#reviews");
  const own=(r?.items||[]).filter(x=>x&&x.consent===true&&String(x.text||"").trim());
  const quotes=(r&&r.showQuotes===true?(r.quotes||[]):[]).filter(x=>x&&String(x.text||"").trim());
  const src=r?.source&&safeUrl(r.source.url)&&has(r.source.label);
  if(!live(r)||(!own.length&&!quotes.length&&!src)){ s.hidden=true; return; }
  s.hidden=false; $("#reviews-t").textContent=L(r.title);
  const i=$("#reviews-i"); i.textContent=L(r.intro); i.hidden=!has(r.intro);
  const qt=$("#reviews-qt"); qt.textContent=U("quotesTitle"); qt.hidden=!quotes.length;
  const q=$("#reviews-q"); q.innerHTML="";
  quotes.forEach(x=>{ const b=document.createElement("blockquote");
    const meta=[x.initials,x.place,x.date?nice(x.date):""].filter(Boolean).map(esc).join(" · ");
    b.innerHTML=`<span class="st">★★★★★</span><p>${esc(x.text)}</p>`+(meta?`<cite>${meta}</cite>`:"");
    q.appendChild(b); });
  const ot=$("#reviews-ot"); ot.textContent=U("ownTitle"); ot.hidden=!own.length;
  const o=$("#reviews-o"); o.innerHTML="";
  own.forEach(x=>{ const b=document.createElement("blockquote");
    b.innerHTML=`<p>${esc(x.text)}</p>`+(x.name?`<cite>${esc(x.name)}${x.date?" · "+esc(nice(x.date)):""}</cite>`:"");
    o.appendChild(b); });
  const sl=$("#reviews-s");
  if(src){ sl.innerHTML=`<a href="${esc(safeUrl(r.source.url))}" target="_blank" rel="noopener">${esc(L(r.source.label))}</a>`; sl.hidden=false; }
  else sl.hidden=true;
}
function renderPractice(){
  const pr=D.practice, s=$("#practice"), p=D.profile||{};
  const places=(pr?.locations||[]).filter(l=>String(l.street||"").trim()||String(l.zipCity||"").trim());
  if(!live(pr)||!places.length){ s.hidden=true; return; }
  s.hidden=false; $("#practice-t").textContent=L(pr.title);
  const i=$("#practice-i"); i.textContent=L(pr.intro); i.hidden=!has(pr.intro);
  const box=$("#practice-l"); box.innerHTML="";
  places.forEach(pl=>{
    const d=document.createElement("div"); d.className="place";
    const hours=(pl.hours||[]).filter(h=>h&&h.time);
    d.innerHTML=(has(pl.label)?`<h3>${esc(L(pl.label))}</h3>`:"")
      +`<address>${pl.street?ltr(pl.street):""}${pl.street&&pl.zipCity?"<br>":""}${pl.zipCity?ltr(pl.zipCity):""}</address>`
      +(has(pl.note)?`<p class="linkline">${esc(L(pl.note))}</p>`:"")
      +(hours.length?`<p class="sub" style="margin:18px 0 6px">${esc(U("hours"))}</p><ul class="hours">${hours.map(h=>`<li><span>${esc(L(h.day))}</span><span>${ltr(h.time)}</span></li>`).join("")}</ul>`:"")
      +(safeUrl(pl.mapUrl)?`<p class="linkline"><a href="${esc(safeUrl(pl.mapUrl))}" target="_blank" rel="noopener">${esc(U("map"))}</a></p>`:"");
    box.appendChild(d); });
  const cta=$("#practice-cta"); cta.innerHTML="";
  if(p.phone){ const a=document.createElement("a"); a.className="btn"; a.href="tel:"+String(p.phone).replace(/\s+/g,"");
    a.innerHTML=SVG.tel+`<span>${ltr(p.phone)}</span>`; cta.appendChild(a); }
  if(p.email){ const a=document.createElement("a"); a.className="btn"; a.href="mailto:"+p.email;
    a.innerHTML=SVG.mail+`<span>${esc(U("email"))}</span>`; cta.appendChild(a); }
}
function mapsUrl(){
  const l=((D.practice||{}).locations||[]).find(x=>x&&(x.street||x.zipCity));
  if(!l) return "";
  if(safeUrl(l.mapUrl)) return safeUrl(l.mapUrl);
  const q=[l.street,l.zipCity].filter(Boolean).join(", ");
  return q?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q):"";
}
function renderFab(){
  const p=D.profile||{}, box=$("#fab"); box.innerHTML="";
  const icon=(href,label,svg,cls,blank)=>{ const u=safeUrl(href); if(!u) return;
    const a=document.createElement("a"); a.className="ico"+(cls?" "+cls:""); a.href=u; a.setAttribute("aria-label",label);
    a.innerHTML=svg; if(blank){ a.target="_blank"; a.rel="noopener"; } box.appendChild(a); };
  if(p.phone) icon("tel:"+String(p.phone).replace(/\s+/g,""),U("callAria"),SVG.tel);
  const wa=String(p.whatsapp||"").replace(/[^\d+]/g,"");
  if(wa) icon("https://wa.me/"+wa.replace(/^\+/,""),U("whatsapp"),SVG.wa,"wa",true);
  if(p.email) icon("mailto:"+p.email,U("email"),SVG.mail);
  icon(mapsUrl(),U("map"),SVG.pin,"",true);
  const main=document.createElement("a"); main.className="main";
  if(safeUrl(p.bookingUrl)){ main.href=safeUrl(p.bookingUrl); main.target="_blank"; main.rel="noopener";
    main.innerHTML=SVG.cal+"<span>"+esc(U("book"))+"</span>"; }
  else if(!$("#practice").hidden){ main.href="#practice"; main.innerHTML=SVG.cal+"<span>"+esc(U("contactAction"))+"</span>"; }
  else if(p.email){ main.href="mailto:"+p.email; main.innerHTML=SVG.mail+"<span>"+esc(U("email"))+"</span>"; }
  if(main.href) box.appendChild(main);
  box.hidden=!box.children.length;
  const hc=$("#headcta"), p2=D.profile||{};
  if(p2.phone){ hc.href="tel:"+String(p2.phone).replace(/\s+/g,""); hc.innerHTML=SVG.tel+`<span>${ltr(p2.phone)}</span>`; hc.hidden=false; }
  else if(safeUrl(p2.bookingUrl)){ hc.href=safeUrl(p2.bookingUrl); hc.target="_blank"; hc.rel="noopener"; hc.innerHTML=SVG.cal+`<span>${esc(U("book"))}</span>`; hc.hidden=false; }
  else if(!$("#practice").hidden){ hc.href="#practice"; hc.innerHTML=SVG.pin+`<span>${esc(U("contactAction"))}</span>`; hc.hidden=false; }
  else hc.hidden=true;
}
function renderNav(){
  const ids=["approach","expertise","services","reviews","practice"].filter(id=>!$("#"+id).hidden);
  const items=(D.nav||[]).filter(n=>ids.includes(n.id));
  $("#nav").innerHTML=items.map(n=>`<a href="#${esc(n.id)}">${esc(L(n.label))}</a>`).join("");
  $("#panel-nav").innerHTML=items.map(n=>`<li><a href="#${esc(n.id)}">${esc(L(n.label))}</a></li>`).join("");
  $("#burger").hidden=!items.length;
  $("#burger").setAttribute("aria-label",U("menu"));
}
function renderFooter(){
  const p=D.profile||{}, lg=D.legal||{};
  const c=$("#f-contact"); const bits=[];
  if(p.email) bits.push(`<a href="mailto:${esc(p.email)}">${ltr(p.email)}</a>`);
  if(p.phone) bits.push(`<a href="tel:${esc(String(p.phone).replace(/\s+/g,""))}">${ltr(p.phone)}</a>`);
  if(safeUrl(p.profileUrl)) bits.push(`<a href="${esc(safeUrl(p.profileUrl))}" target="_blank" rel="noopener">${esc(U("profile"))}</a>`);
  c.innerHTML=`<h3>${esc(p.name||"")}</h3>${bits.join("<br>")}`;
  const fl=$("#f-legal"); const rows=[];
  if(lg.albo) rows.push(`${esc(U("albo"))}: ${ltr(lg.albo)}${lg.alboProvince?" ("+esc(lg.alboProvince)+")":""}`);
  if(lg.vat) rows.push(`${esc(U("vat"))}: ${ltr(lg.vat)}`);
  if(lg.address) rows.push(ltr(lg.address));
  if(rows.length){ fl.innerHTML=`<h3>${esc(U("legalTitle"))}</h3>${esc(lg.legalName||"")}<br>${rows.join("<br>")}`; fl.hidden=false; }
  else fl.hidden=true;
  /* Die Datenschutzerklaerung steht als ein Text in content.json. Eine Leerzeile trennt zwei Absaetze.
     Fehlt die E-Mail, bleibt ein Komma vor dem Punkt stehen, das die erste Ersetzung entfernt. */
  const pv=fill(L(lg.privacy),{name:lg.legalName||p.name||"",email:lg.email||p.email||"[email]"});
  $("#f-privacy").innerHTML=`<h3>${esc(U("privacyTitle"))}</h3>`
    +pv.split(/\n\s*\n/).map(t=>t.replace(/\s+/g," ").trim()).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join("");
  $("#f-emergency").textContent=U("emergency");
  $("#f-copy").textContent=fill(L(D.footer&&D.footer.text),{year:new Date().getFullYear(),name:p.name||""});
}
function render(){
  document.title=(D.seo&&D.seo.title)||"Farida Benslimane";
  const desc=L(D.seo&&D.seo.description), m=document.querySelector('meta[name="description"]'); if(m&&desc) m.content=desc;
  langBar(); renderHero(); renderApproach(); renderExpertise(); renderServices(); renderReviews(); renderPractice();
  renderTrust(); renderFab();
  const anyLive=["approach","expertise","services","reviews","practice"].some(id=>!$("#"+id).hidden);
  $("#preparing").hidden=anyLive; $("#preparing-t").textContent=U("preparing");
  renderNav(); renderFooter();
}
const panel=$("#panel");
function openPanel(o){ panel.toggleAttribute("open",o); $("#burger").setAttribute("aria-expanded",String(o));
  document.body.style.overflow=o?"hidden":""; if(o) $("#panel-close").focus(); else $("#burger").focus(); }
$("#burger").addEventListener("click",()=>openPanel(true));
$("#panel-close").addEventListener("click",()=>openPanel(false));
panel.addEventListener("click",e=>{ if(e.target.tagName==="A") openPanel(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&panel.hasAttribute("open")) openPanel(false); });
(async function boot(){
  try{ D=await (await fetch("content.json?v="+Date.now())).json(); }
  catch(e){ $("#preparing").hidden=false; $("#preparing-t").textContent="content.json"; return; }
  let saved=null; try{ saved=localStorage.getItem("fb-lang"); }catch(e){}
  const url=new URLSearchParams(location.search).get("lang");
  const nav=(navigator.languages||[navigator.language||"it"]).map(x=>String(x).slice(0,2).toLowerCase()).find(x=>LANGS.includes(x));
  setLang(url||saved||nav||(D.profile&&D.profile.defaultLang)||"it",!!url);
})();
</script>
</body>
</html>
