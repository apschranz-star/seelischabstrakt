# Second site from the same repository: base directory farida, no build step.
[build]
  publish = "."
  # Arms the access gate when SITE_ACCESS_KEY is set in the Netlify environment, see ../gate/README.md.
  command = "sh ../gate/inject.sh index.html \"$SITE_ACCESS_KEY\""
  # Build only when something in this folder changed. Compares against the last commit that was
  # actually deployed, not against the previous commit, so a skipped build never leaves the site
  # behind. If the comparison cannot run, the command fails and Netlify builds as usual.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  # Selbst ausgelieferte Schriften. Der Dateiname traegt Familie, Schnitt und
  # Zeichensatz, eine geaenderte Schrift ist also eine andere Datei; damit darf
  # der Browser sie behalten, statt sie bei jedem Aufruf neu zu holen.
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
